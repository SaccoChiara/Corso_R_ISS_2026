<!--
  LOGHI IN ALTO SU TUTTE LE PAGINE DEL SITO
  Viene aggiunto a ogni pagina da _quarto.yml (include-before-body).
  Lo script sposta i loghi all'inizio del contenuto della pagina,
  sotto il menu in alto. Lo stile e' in sito.css (.sito-loghi).
-->
<div class="sito-loghi" id="sito-loghi">
  <img src="immagini/logo_iss.png" alt="Logo dell'Istituto Superiore di Sanità">
  <img src="immagini/logo_dip_malattie_infettive.png" alt="Logo del Dipartimento Malattie Infettive">
</div>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var loghi = document.getElementById("sito-loghi");
    var main = document.querySelector("main");
    if (loghi && main) main.insertBefore(loghi, main.firstChild);
  });
</script>
